name: Continuous Noise
version: "1.0.0"
slug: continuous-noise
description: Ciągłe odtwarzanie wybranego szumu na wyjściu audio Home Assistant OS
url: "https://github.com/Wilk33/deye-solarman-ha-addon"
stage: experimental
init: false
tmpfs: true
audio: true
services:
  - mqtt:need
arch:
  - aarch64
  - amd64
options:
  noises:
    - key: pink
      name: Szum różowy
      type: pink
    - key: violet
      name: Szum fioletowy
      type: violet
  volume_percent: 50
  alarm_coordination_topic: haos_alarm/active
  alarm_availability_topic: haos_alarm/availability
  mqtt_base_topic: continuous_noise
  mqtt_discovery_prefix: homeassistant
  device_name: Szum ciągły
  log_level: INFO
schema:
  noises:
    - key: str
      name: str
      type: list(white|pink|brown|violet)
  volume_percent: int(0,100)
  alarm_coordination_topic: str
  alarm_availability_topic: str
  mqtt_base_topic: str
  mqtt_discovery_prefix: str
  device_name: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
