configuration:
  output_mode: {name: Output mode, description: Select exactly one alarm output - audio or Raspberry Pi 5 GPIO.}
  monitored_entities: {name: Monitored entities, description: List of entities with four optional thresholds and a rearming hysteresis. An empty threshold is disabled.}
  notification_targets: {name: Notification targets, description: List of notify entities shown in Developer Tools -> States, such as notify.phone.}
  notify_recovery: {name: Recovery notification, description: Notify when a value completes its alarm cycle and the sensor is rearmed.}
  audio_file: {name: Alarm file, description: Optional WAV file from /media. Empty uses the built-in alarm.}
  audio_volume_percent: {name: Alarm volume, description: Audio output volume in percent.}
  gpio_pin: {name: BCM GPIO, description: Raspberry Pi 5 BCM GPIO number used in GPIO mode.}
  gpio_active_high: {name: Active high, description: Enable to assert a high state during an alarm. Disable for active-low output.}
  poll_interval_seconds: {name: Poll interval, description: Time between Home Assistant entity reads.}
  alarm_coordination_topic: {name: Audio coordination topic, description: Retained MQTT topic used to pause noise during an alarm.}
  mqtt_base_topic: {name: MQTT base topic, description: Topic prefix for the Alarm app.}
  mqtt_discovery_prefix: {name: Discovery prefix, description: Usually homeassistant.}
  device_name: {name: Device name, description: Device name shown in Home Assistant.}
  log_level: {name: Log level, description: Application log verbosity.}
