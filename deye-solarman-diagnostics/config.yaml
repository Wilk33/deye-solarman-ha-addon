name: Deye Solarman Diagnostics
description: Diagnostics add-on for Deye inverter battery data through a local Solarman logger
version: "0.3.3"
slug: deye-solarman-diagnostics
url: "https://github.com/Wilk33/deye-solarman-ha-addon"
services:
  - mqtt:need
init: false
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:solar-power-variant-outline
panel_title: Deye Solarman
panel_admin: true
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
map:
  - app_config:rw
  - share:rw
options:
  logger:
    host: 192.168.1.100
    port: 8899
    serial_number: 0
    modbus_id: 1
    timeout: 3
    reconnect_delay: 10
  mqtt:
    host: core-mosquitto
    port: 1883
    username: ""
    password: ""
    client_id: deye-solarman-diagnostics
    base_topic: deye_solarman
    discovery_prefix: homeassistant
    retain: true
  inverter:
    serial_number: "2507092018"
    name: Deye Solarman Diagnostics
    manufacturer: Deye
    model: SG05LP3
  profiles:
    default_profile: deye_battery_packs
    overrides_file: /config/user_sensors.yaml
    state_file: /config/runtime_state.json
    scan_report_file: /share/deye_solarman_scan_report.json
  polling:
    default_interval: 60
    slow_interval: 600
    read_message_spacing: 0.05
    batch_gap: 1
    max_registers_per_request: 20
    publish_unchanged_every: 900
    startup_probe_register: 10040
    startup_probe_count: 1
    allow_reconnect: true
  advanced:
    emit_raw_topics: true
    emit_scan_report: true
  scan:
    mode: disabled
    report_file: /share/deye_solarman_candidate_scan.json
    detected_sensors_file: /config/detected_sensors.yaml
    bms_pack_count: 4
schema:
  logger:
    host: str
    port: port
    serial_number: int
    modbus_id: int(1,247)
    timeout: int(1,15)
    reconnect_delay: int(1,300)
  mqtt:
    host: str
    port: port
    username: str?
    password: password?
    client_id: str
    base_topic: str
    discovery_prefix: str
    retain: bool
  inverter:
    serial_number: str
    name: str
    manufacturer: str
    model: str
  profiles:
    default_profile: list(deye_battery_packs)
    overrides_file: str
    state_file: str
    scan_report_file: str
  polling:
    default_interval: int(5,3600)
    slow_interval: int(30,86400)
    read_message_spacing: float(0,2)
    batch_gap: int(0,20)
    max_registers_per_request: int(1,125)
    publish_unchanged_every: int(30,86400)
    startup_probe_register: int(0,65535)
    startup_probe_count: int(1,10)
    allow_reconnect: bool
  advanced:
    emit_raw_topics: bool
    emit_scan_report: bool
  scan:
    mode: list(disabled|scan_only|scan_and_monitor)
    report_file: str
    detected_sensors_file: str
    bms_pack_count: int(1,10)
