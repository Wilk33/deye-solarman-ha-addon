name: SolarMan Diagnostics
description: Deye inverter diagnostics through SolarMan TCP and direct Modbus RTU (RS485)
version: "2.0.5"
slug: deye-solarman-diagnostics
url: "https://github.com/Wilk33/deye-solarman-ha-addon"
services:
  - mqtt:need
init: false
uart: true
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:solar-power-variant-outline
panel_title: SolarMan Diagnostics
panel_admin: true
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
map:
  - app_config:rw
  - share:rw
options:
  solarman:
    enabled: true
    host: 192.168.1.100
    port: 8899
    serial_number: 0
    modbus_id: 1
    timeout: 3
    reconnect_delay: 10
    polling:
      default_interval: 60
      slow_interval: 600
      read_message_spacing: 0.05
      batch_gap: 1
      max_registers_per_request: 20
      publish_unchanged_every: 900
      startup_probe_register: 10040
      startup_probe_count: 1
      allow_reconnect: true
  rs485:
    enabled: false
    device: /dev/ttyUSB0
    baudrate: 9600
    bytesize: 8
    parity: N
    stopbits: 1
    modbus_id: 1
    timeout: 1
    reconnect_delay: 10
    polling:
      default_interval: 60
      slow_interval: 600
      read_message_spacing: 0.05
      batch_gap: 1
      max_registers_per_request: 20
      publish_unchanged_every: 900
      startup_probe_register: 10040
      startup_probe_count: 1
      allow_reconnect: true
  mqtt:
    use_supervisor: true
    host: core-mosquitto
    port: 1883
    username: ""
    password: ""
    tls: false
    client_id: solarman
    base_topic: solarman_diagnostics
    discovery_prefix: homeassistant
    retain: true
  inverter_serial_number: "2507092018"
  inverter_name: SolarMan Diagnostics
  inverter_manufacturer: Deye
  inverter_model: SG05LP3
  overrides_file: /config/user_sensors.yaml
  custom_sensors_file: /config/custom_sensors.yaml
  state_file: /config/runtime_state.json
  scan_report_file: /share/deye_solarman_scan_report.json
  emit_raw_topics: true
  emit_scan_report: true
  detailed_logs: false
  scan_mode: disabled
  scan_candidate_report_file: /share/deye_solarman_candidate_scan.json
  detected_sensors_file: /config/detected_sensors.yaml
  bms_pack_count: 4
  catalog:
    refresh_on_start: true
    url: https://raw.githubusercontent.com/Wilk33/deye-solarman-ha-addon/main/catalogs/models/deye_sg04_sg05_3ph_lv/telemetry.yaml
    control_url: https://raw.githubusercontent.com/Wilk33/deye-solarman-ha-addon/main/catalogs/models/deye_sg04_sg05_3ph_lv/control.yaml
    timeout: 5
schema:
  solarman:
    enabled: bool
    host: str
    port: port
    serial_number: int
    modbus_id: int(1,247)
    timeout: int(1,15)
    reconnect_delay: int(1,300)
    polling:
      default_interval: int(5,3600)
      slow_interval: int(30,86400)
      read_message_spacing: float(0,2)
      batch_gap: int(0,20)
      max_registers_per_request: int(1,125)
      publish_unchanged_every: int(30,86400)
      startup_probe_register: int(0,65535)
      startup_probe_count: int(1,10)
      allow_reconnect: bool
  rs485:
    enabled: bool
    device: device(subsystem=tty)
    baudrate: int(1200,115200)
    bytesize: list(7|8)
    parity: list(N|E|O)
    stopbits: list(1|1.5|2)
    modbus_id: int(1,247)
    timeout: float(0.1,15)
    reconnect_delay: int(1,300)
    polling:
      default_interval: int(5,3600)
      slow_interval: int(30,86400)
      read_message_spacing: float(0,2)
      batch_gap: int(0,20)
      max_registers_per_request: int(1,125)
      publish_unchanged_every: int(30,86400)
      startup_probe_register: int(0,65535)
      startup_probe_count: int(1,10)
      allow_reconnect: bool
  mqtt:
    use_supervisor: bool
    host: str
    port: port
    username: str?
    password: password?
    tls: bool
    client_id: str
    base_topic: str
    discovery_prefix: str
    retain: bool
  inverter_serial_number: str
  inverter_name: str
  inverter_manufacturer: str
  inverter_model: str
  overrides_file: str
  custom_sensors_file: str
  state_file: str
  scan_report_file: str
  emit_raw_topics: bool
  emit_scan_report: bool
  detailed_logs: bool
  scan_mode: list(disabled|scan_only|scan_and_monitor)
  scan_candidate_report_file: str
  detected_sensors_file: str
  bms_pack_count: int(1,10)
  catalog:
    refresh_on_start: bool
    url: str?
    control_url: str?
    timeout: int(1,30)
