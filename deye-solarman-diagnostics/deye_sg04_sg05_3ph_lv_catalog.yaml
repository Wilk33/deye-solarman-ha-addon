version: 2
# Canonical read-only catalog for Deye SUN-*K-SG04LP3 / SG05LP3 three-phase LV hybrid inverters.
# The entry meanings are an audit baseline from protocol maps and open-source definitions.
# A successful scan proves read access, not the semantic meaning of a BMS candidate.
# Do not add writable configuration registers to this catalog.
# BMS serial words use low-byte-first ASCII. Other ASCII definitions stay high-byte-first by default.
sensors:
  - {key: run_state, name: Run State, registers: [500], type: uint16, schedule: slow}
  - {key: relay_status, name: Relay Status, registers: [552], type: hex, schedule: slow, read_every: 300, report_every: 600}
  - {key: warning_flags, name: Warning Flags, registers: [553, 554], type: hex, schedule: slow, read_every: 300, report_every: 600}
  - {key: fault_flags, name: Fault Flags, registers: [555, 556, 557, 558], type: hex, schedule: slow, read_every: 300, report_every: 600}
  - {key: pv1_voltage, name: PV1 Voltage, registers: [676], type: uint16, multiplier: 0.1, unit: V, device_class: voltage, state_class: measurement}
  - {key: pv1_current, name: PV1 Current, registers: [677], type: uint16, multiplier: 0.1, unit: A, device_class: current, state_class: measurement}
  - {key: pv1_power, name: PV1 Power, registers: [672], type: uint16, unit: W, device_class: power, state_class: measurement}
  - {key: pv2_voltage, name: PV2 Voltage, registers: [678], type: uint16, multiplier: 0.1, unit: V, device_class: voltage, state_class: measurement}
