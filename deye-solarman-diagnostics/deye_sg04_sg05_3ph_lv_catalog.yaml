    - {key: "battery_{pack}_temperature", name: "Battery {pack} Temperature", register_offsets: [10], type: uint16, multiplier: 0.1, offset: -100.0, unit: "\u00B0C", device_class: temperature, state_class: measurement, topic_suffix: "battery_{pack}/temperature"}
