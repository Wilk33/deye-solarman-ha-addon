bms_pack:
  base_register: 10032
  register_stride: 38
  sensors:
    - {key: "battery_{pack}_bms_serial", name: "Battery {pack} BMS Serial", register_offsets: [0, 1, 2, 3, 4, 5, 6, 7], type: ascii, byte_order: low_high, schedule: slow, read_every: 3600, report_every: 3600}
    - {key: "battery_{pack}_voltage", name: "Battery {pack} Voltage", register_offsets: [8], type: uint16, multiplier: 0.1, unit: V, device_class: voltage, state_class: measurement, topic_suffix: "battery_{pack}/voltage"}
